name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Electron UI smoke tests
        timeout-minutes: 5
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: |
          npm run smoke
          npm run smoke:connections
      - run: npm run source:archive
      - name: Build the Mac app
        if: runner.os == 'macOS'
        run: npm run build:mac
      - name: Build the Windows app
        if: runner.os == 'Windows'
        run: npm run build:windows
      - name: Upload portable Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: workwork-windows-x64
          path: dist/workwork-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
